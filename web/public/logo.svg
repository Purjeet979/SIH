<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  
  <!-- Shield Icon Container -->
  <g transform="translate(6, 6)">
    <!-- Outer Shield -->
    <path d="M24 4 L42 10 V24 C42 35 24 44 24 44 C24 44 6 35 6 24 V10 L24 4 Z" fill="url(#shieldGrad)" />
    
    <!-- Scan Line Effect -->
    <line x1="8" y1="22" x2="40" y2="22" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Checkmark inside Shield -->
    <path d="M15 23 L21 29 L33 17" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="60" y="34" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="24" fill="currentColor">
    Rule<tspan fill="#0284c7">Scan</tspan>
  </text>
  <text x="60" y="48" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="10" fill="#64748b" letter-spacing="1.5">
    LEGAL METROLOGY
  </text>
</svg>
