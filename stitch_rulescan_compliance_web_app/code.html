<defs>

<stop offset="0%" stop-color="#3B82F6" stop-opacity="0.0"></stop>

<filter height="140%" id="softGlow" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="8"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
</filter>
</defs>
<style>
    @keyframes floatDoc {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes scanLine {
      0% { transform: translateY(40px); opacity: 0.2; }
      50% { transform: translateY(180px); opacity: 1; }
      100% { transform: translateY(40px); opacity: 0.2; }
    }
    @keyframes pulseTarget {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .floating-sheet {
      animation: floatDoc 6s ease-in-out infinite;
      transform-origin: center;
    }
    .scanner-beam {
      animation: scanLine 3.5s ease-in-out infinite;
    }
    .pulse-ring {
      animation: pulseTarget 3s ease-in-out infinite;
      transform-origin: center;
    }
  </style>
<!-- Ambient background glow -->
<circle cx="160" cy="140" fill="#EFF6FF" filter="url(#softGlow)" opacity="0.8" r="100"></circle>

<rect fill="#059669" height="6" opacity="0.8" rx="3" width="70" x="30" y="13"></rect>

</g>

</g>
